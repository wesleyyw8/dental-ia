services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
  postgres:
    image: postgres:17
    container_name: dental-ai-postgres

    environment:
      POSTGRES_DB: dental_ai
      POSTGRES_USER: dental_user
      POSTGRES_PASSWORD: dental_password

    ports:
      - "5432:5432"

    volumes:
      - dental_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  redis:
    image: redis:7
    container_name: dental-ai-redis
    ports:
      - "6379:6379"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"

  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
      - "50000:50000"

volumes:
  dental_data: